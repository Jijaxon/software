# SPA ichki nginx (konteyner ichida). Markaziy reverse-proxy bu konteynerni
# cosmetic_frontend:80 sifatida ko'radi va unga / so'rovlarini uzatadi.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik aktivlarni uzoq muddat keshlaymiz (fayl nomlarida hash bor)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router uchun: har qanday yo'l index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
    }
}
