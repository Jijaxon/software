# NAFIS cosmetic — markaziy reverse-proxy stack uchun sayt konfiguratsiyasi.
# Bu fayl nginx stack'ingizdagi conf.d/ (yoki sites-enabled) ichiga qo'yiladi.
# nginx cosmetic_backend/cosmetic_frontend konteynerlarini ko'rishi uchun
# "cosmetic_web_network" tashqi tarmog'iga ulangan bo'lishi kerak.

server {
    #listen 443 ssl http2;   # SSL sertifikat o'rnatilgach yoqing
    listen 80;
    server_name cosmetic.saloxiddin.uz;

    server_tokens off;

    # Rasmlar unsplash/data: dan ham kelishi mumkin; inline style (animatsiyalar)
    # uchun 'unsafe-inline' kerak. Hozir Report-Only — hech narsani bloklamaydi,
    # keyinroq enforcing qilishdan oldin konsolni tekshiring.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Dotfiles (.env, .git, ...) hech qachon berilmasin
    location ~ /\. {
        deny all;
    }

    # Bu stack'da PHP yo'q — .php so'rovi doim scanner/bot
    location ~* \.php$ {
        return 403;
    }

    # Yuklangan fayllar (rasmlar) — backend'dan, lekin keshlanadi (tezlik uchun)
    location /api/uploads {
        proxy_pass http://cosmetic_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # API — no-cache (dinamik ma'lumot)
    location /api {
        proxy_pass http://cosmetic_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Rasm yuklash uchun (multer limiti 10MB)
        client_max_body_size 15M;
    }

    # Qolgan hamma narsa — SPA frontend (admin paneli ham shu yerda, /admin/...)
    location / {
        proxy_pass http://cosmetic_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
